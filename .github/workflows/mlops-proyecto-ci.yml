name: mlops-proyecto-ci

on:
  push:
    paths:
      - "Semana14/Mlops-Proyecto/**"
      - ".github/workflows/mlops-proyecto-ci.yml"
  pull_request:
    paths:
      - "Semana14/Mlops-Proyecto/**"
      - ".github/workflows/mlops-proyecto-ci.yml"

defaults:
  run:
    working-directory: Semana14/Mlops-Proyecto

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Revisar lint
        run: |
          ruff check .

      - name: Construir índice RAG
        run: |
          python scripts/build_index.py

      - name: Ejecutar pruebas
        run: |
          pytest -q

      - name: Evaluar RAG
        run: |
          python scripts/evaluate_rag.py

      - name: Construir imagen Docker
        run: |
          docker build -t cc0c2-mlops-rag:ci .

      - name: Smoke test Docker
        run: |
          docker run -d --name cc0c2-mlops-rag -p 8000:8000 cc0c2-mlops-rag:ci
          sleep 5
          curl -f http://localhost:8000/health
          docker logs cc0c2-mlops-rag
          docker stop cc0c2-mlops-rag
